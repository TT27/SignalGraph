name: SignalGraph Desk

on:
  push:
    branches: [main, feature/signalgraph-lite]
    paths:
      - 'examples/signalgraph_lite/**'
      - '.github/workflows/signalgraph_desk.yml'
  pull_request:
    paths:
      - 'examples/signalgraph_lite/**'
      - '.github/workflows/signalgraph_desk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest==9.1.1 ruff==0.17.0 pyright==1.1.414
      - run: python -m pytest -c /dev/null --confcutdir=examples/signalgraph_lite examples/signalgraph_lite/tests -q
      - run: python -m ruff check examples/signalgraph_lite
      - run: python -m ruff format --check examples/signalgraph_lite
      - run: python -m pyright --project examples/signalgraph_lite/pyrightconfig.json
      - run: python -m examples.signalgraph_lite.evaluate
      - run: node --check examples/signalgraph_lite/static/app.js && node --check examples/signalgraph_lite/static/workspace.js
  browser-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python examples/signalgraph_lite/tests/desk_smoke.py --artifacts work/ci-captures
